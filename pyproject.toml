[project]
name = "DeepRole"
version = "0.1.0"
description = "A chatbot with long-term memory and personal customization"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai>=1.79.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "tiktoken>=0.7",
    "httpx>=0.27",
    "jieba>=0.42.1",
    # 本地向量库依赖
    "sqlite-vec>=0.1.6",
    "aiosqlite>=0.22.1",
    "fastapi>=0.116.0",
    "uvicorn>=0.35.0",
    "pydantic-settings>=2.11.0",
    "asyncpg>=0.30.0",
    "bcrypt",
    "sseclient",
]

[project.optional-dependencies]
local-vec = [
    "sqlite-vec>=0.1.6",
    "aiosqlite>=0.22.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
